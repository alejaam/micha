# docker-compose.yml - Producción (Dokploy)
# Usa la base de datos externa de Dokploy

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: micha-api
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    # No exponemos puertos - solo accesible dentro de la red interna via nginx
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: micha-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
