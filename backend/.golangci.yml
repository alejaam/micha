# Golangci-lint configuration - Profesional pero pragmático
run:
  timeout: 5m
  go: '1.23'

linters:
  enable:
    # Esenciales - nunca desactivar
    - errcheck      # Errores no chequeados (crítico)
    - govet         # Vet examina Go source code (crítico)
    - staticcheck   # Análisis estático avanzado (crítico)
    
    # Calidad de código
    - gosimple      # Simplificaciones de código
    - ineffassign   # Asignaciones ineffectuales
    - unused        # Código no usado (reemplaza a deadcode)
    
    # Estilo y formato
    - gofmt         # Formato estándar Go
    - goimports     # Imports ordenados
    - misspell      # Errores ortográficos comunes
    
    # Seguridad
    - gosec         # Problemas de seguridad
    
  disable:
    # Demasiado opinionado/estricto para uso práctico
    - gocritic      # Muy ruidoso sobre optimización prematura
    - revive        # Stuttering names, parámetros no usados (molesto)
    - cyclop        # Complejidad ciclomática
    - funlen        # Longitud de funciones
    - lll           # Longitud de líneas
    - nlreturn      # Require newline before return
    - wsl           # Whitespace linting (muy estricto)
    - gocognit      # Complejidad cognitiva
    - nestif        # Nested ifs
    - prealloc      # Pre-allocaciones (optimización prematura)
    - goconst       # Constantes repetidas (molesto en tests)
    - dupl          # Código duplicado (falsos positivos)
    - gocyclo       # Complejidad ciclomática (duplicado con cyclop)

linters-settings:
  errcheck:
    # Ignorar errores en defer Close() común
    exclude-functions:
      - io.Closer.Close
      - (*os.File).Close
      
  gosec:
    # Desactivar algunos checks que son ruidosos
    excludes:
      - G104  # Errores no chequeados (ya cubierto por errcheck)
      - G307  # Deferring unsafe method
      
  govet:
    enable:
      - shadow
      
  staticcheck:
    checks: ["all", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    # Desactivar comentarios de documentación obligatorios

issues:
  exclude-dirs:
    - vendor
    - mocks
    - generated
    
  exclude-rules:
    # Ignorar errores en tests
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        
    # Ignorar fmt.Print en CLI tools (si hay)
    - linters:
        - forbidigo
      source: fmt\.Print
      
  # Máximo de issues antes de parar
  max-issues-per-linter: 50
  max-same-issues: 10
  
  # Mostrar todos los issues, no solo nuevos
  new: false

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
