name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Backend Validation (Go)
  # ==========================================
  backend:
    name: 🔧 Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 📦 Download Dependencies
        run: go mod download

      - name: 🧪 Run Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./backend/coverage.out

      - name: 🔍 Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./backend
          args: --timeout=5m

  # ==========================================
  # Job 2: Frontend Validation (React)
  # ==========================================
  frontend:
    name: ⚛️ Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔍 ESLint
        run: npm run lint

      - name: 🧪 Run Tests
        run: npm run test:coverage -- --reporter=verbose

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ./frontend/coverage/

      - name: 🏗️ Build
        run: npm run build

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ==========================================
  # Job 3: Integration & Docker
  # ==========================================
  integration:
    name: 🐳 Integration
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config

      - name: 🏗️ Build Docker Images
        run: |
          docker compose -f docker-compose.yml build

  # ==========================================
  # Job 4: Summary
  # ==========================================
  summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    if: always()

    steps:
      - name: 📋 Summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
