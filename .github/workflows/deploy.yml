name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permite deploy manual desde la app de GitHub

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ==========================================
  # Job 1: Pre-deployment Checks
  # ==========================================
  pre-check:
    name: 🔍 Pre-Deploy Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Check Commit Message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit: $COMMIT_MSG"
          
          if echo "$COMMIT_MSG" | grep -qi "\[skip deploy\]"; then
            echo "⚠️ Skip deploy flag found"
            exit 1
          fi

      - name: 📱 Notify Start
        uses: rtCamp/action-slack-notify@v2
        if: env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: '🚀 Iniciando deploy a producción'
          SLACK_TITLE: 'Deploy Started'

  # ==========================================
  # Job 2: Deploy to Dokploy
  # ==========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: pre-check
    if: needs.pre-check.result == 'success'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔄 Trigger Dokploy Deploy
        run: |
          # Reemplaza con tu URL de webhook de Dokploy
          # Se configura en Settings > Secrets > DOKPLOY_WEBHOOK
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK }}" ]; then
            curl -X POST "${{ secrets.DOKPLOY_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"ref":"${{ github.sha }}","repository":"${{ github.repository }}"}'
            echo "✅ Webhook enviado a Dokploy"
          else
            echo "ℹ️ No DOKPLOY_WEBHOOK configurado. Configúralo en Settings > Secrets."
          fi

      - name: ⏳ Wait for Deploy
        run: |
          echo "⏳ Esperando a que Dokploy complete el deploy..."
          echo "Revisa el estado en https://micha.devjaam.tech"
          sleep 30

      - name: ✅ Health Check
        run: |
          for i in {1..5}; do
            if curl -sSf https://micha.devjaam.tech/health > /dev/null 2>&1; then
              echo "✅ Health check pasó"
              exit 0
            fi
            echo "Intento $i/5..."
            sleep 10
          done
          echo "❌ Health check falló"
          exit 1

  # ==========================================
  # Job 3: Post-deploy Notifications
  # ==========================================
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: 🎉 Success Notification
        if: needs.deploy.result == 'success'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: '✅ Deploy exitoso a https://micha.devjaam.tech'
          SLACK_TITLE: 'Deploy Complete'
          SLACK_COLOR: good

      - name: ❌ Failure Notification
        if: needs.deploy.result == 'failure'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: '❌ Deploy falló. Revisar logs en GitHub Actions'
          SLACK_TITLE: 'Deploy Failed'
          SLACK_COLOR: danger
